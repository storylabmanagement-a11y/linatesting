<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Faraya & Beyond — Admin</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #0A0A0A; color: #F5F1E8;
    font-family: -apple-system, Segoe UI, Roboto, Inter, sans-serif;
  }
  header {
    padding: 20px 24px; border-bottom: 1px solid #2A2A2A;
    display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { font-size: 18px; margin: 0; color: #C9A227; letter-spacing: 1px; }
  #signOutBtn { display: none; }
  button {
    background: #C9A227; color: #0A0A0A; border: none; border-radius: 6px;
    padding: 10px 16px; font-weight: 600; cursor: pointer;
  }
  button.secondary { background: transparent; color: #C9A227; border: 1px solid #C9A227; }
  button.danger { background: #E05252; color: #fff; }
  input, textarea, select {
    width: 100%; padding: 10px; margin: 6px 0 14px 0; border-radius: 6px;
    border: 1px solid #2A2A2A; background: #161616; color: #F5F1E8;
  }
  label { font-size: 13px; color: #A8A8A5; }
  main { max-width: 960px; margin: 0 auto; padding: 24px; }
  .card {
    background: #161616; border: 1px solid #2A2A2A; border-radius: 10px;
    padding: 18px; margin-bottom: 14px;
  }
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
  .tab {
    padding: 8px 16px; border-radius: 20px; cursor: pointer;
    border: 1px solid #2A2A2A; color: #A8A8A5;
  }
  .tab.active { background: #C9A227; color: #0A0A0A; border-color: #C9A227; }
  .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .hidden { display: none; }
  #loginBox { max-width: 360px; margin: 80px auto; }
  .muted { color: #A8A8A5; font-size: 13px; }
  h2 { font-family: Georgia, serif; color: #F5F1E8; }
</style>
</head>
<body>

<header>
  <h1>FARAYA &amp; BEYOND — ADMIN</h1>
  <button id="signOutBtn" class="secondary">Sign out</button>
</header>

<main>
  <div id="loginBox" class="card">
    <h2>Admin Sign In</h2>
    <p class="muted">Sign in with an account listed in the Firestore <code>admins</code> collection.</p>
    <label>Email</label>
    <input id="email" type="email" />
    <label>Password</label>
    <input id="password" type="password" />
    <button id="signInBtn">Sign In</button>
    <p id="loginError" class="muted" style="color:#E05252;"></p>
  </div>

  <div id="app" class="hidden">
    <div class="tabs">
      <div class="tab active" data-tab="events">Events</div>
      <div class="tab" data-tab="places">Places</div>
      <div class="tab" data-tab="news">News</div>
    </div>

    <div id="panel-events" class="panel"></div>
    <div id="panel-places" class="panel hidden"></div>
    <div id="panel-news" class="panel hidden"></div>
  </div>
</main>

<!-- Firebase compat SDK (loaded from the admin's own browser at runtime, not this build machine) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script>
// ---------------------------------------------------------------------------
// REPLACE with the real Web app config from Firebase Console > Project Settings
// > Add app > Web (this is a separate registration from the Android app).
// ---------------------------------------------------------------------------
const firebaseConfig = {
  apiKey: "REPLACE_WITH_REAL_WEB_API_KEY",
  authDomain: "explore-8a482.firebaseapp.com",
  projectId: "explore-8a482",
  storageBucket: "explore-8a482.firebasestorage.app",
  messagingSenderId: "252009200155",
  appId: "REPLACE_WITH_REAL_WEB_APP_ID"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const loginBox = document.getElementById('loginBox');
const appBox = document.getElementById('app');
const signOutBtn = document.getElementById('signOutBtn');

document.getElementById('signInBtn').onclick = async () => {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const errorEl = document.getElementById('loginError');
  errorEl.textContent = '';
  try {
    await auth.signInWithEmailAndPassword(email, password);
  } catch (e) {
    errorEl.textContent = e.message;
  }
};

signOutBtn.onclick = () => auth.signOut();

auth.onAuthStateChanged(async (user) => {
  if (!user) {
    loginBox.classList.remove('hidden');
    appBox.classList.add('hidden');
    signOutBtn.style.display = 'none';
    return;
  }
  const adminDoc = await db.collection('admins').doc(user.uid).get();
  if (!adminDoc.exists) {
    document.getElementById('loginError').textContent = 'This account is not an admin.';
    await auth.signOut();
    return;
  }
  loginBox.classList.add('hidden');
  appBox.classList.remove('hidden');
  signOutBtn.style.display = 'inline-block';
  initPanels();
});

document.querySelectorAll('.tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.add('hidden'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.tab).classList.remove('hidden');
  };
});

function esc(s) {
  return (s || '').toString().replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

// Field definitions per collection: [key, label, type] — type "list" = comma-separated -> array,
// "tiers" = "Name:Price, Name:Price" -> [{name, price}]
const SCHEMAS = {
  events: {
    fields: [
      ['title', 'Title', 'text'],
      ['organizer', 'Organizer', 'text'],
      ['venue', 'Venue', 'text'],
      ['date', 'Date (display text)', 'text'],
      ['description', 'Description', 'textarea'],
      ['lineup', 'Lineup (comma-separated)', 'list'],
      ['photos', 'Photo URLs (comma-separated)', 'list'],
      ['category', 'Category', 'text'],
      ['tiers', 'Ticket Tiers (Name:Price, Name:Price)', 'tiers'],
      ['featured', 'Featured (true/false)', 'bool']
    ]
  },
  places: {
    fields: [
      ['name', 'Name', 'text'],
      ['category', 'Category', 'text'],
      ['shortDescription', 'Short Description', 'text'],
      ['longDescription', 'Long Description', 'textarea'],
      ['photos', 'Photo URLs (comma-separated)', 'list'],
      ['hours', 'Hours', 'text'],
      ['entryFee', 'Entry Fee', 'text'],
      ['phone', 'Phone', 'text'],
      ['driveTimeBeirut', 'Drive Time from Beirut', 'text'],
      ['driveTimeJounieh', 'Drive Time from Jounieh', 'text'],
      ['featured', 'Featured (true/false)', 'bool']
    ]
  },
  news: {
    fields: [
      ['title', 'Title', 'text'],
      ['blurb', 'Blurb', 'textarea'],
      ['imageUrl', 'Image URL', 'text'],
      ['category', 'Category', 'text']
    ]
  }
};

function fieldToForm(key, label, type, value) {
  const id = 'f_' + key;
  if (type === 'textarea') {
    return `<label>${label}</label><textarea id="${id}" rows="3">${esc(value)}</textarea>`;
  }
  return `<label>${label}</label><input id="${id}" value="${esc(value)}" />`;
}

function readForm(fields) {
  const out = {};
  fields.forEach(([key, label, type]) => {
    const el = document.getElementById('f_' + key);
    const raw = el.value;
    if (type === 'list') {
      out[key] = raw.split(',').map(s => s.trim()).filter(Boolean);
    } else if (type === 'tiers') {
      out[key] = raw.split(',').map(s => s.trim()).filter(Boolean).map(pair => {
        const [name, price] = pair.split(':').map(s => s.trim());
        return { name: name || '', price: parseFloat(price) || 0, description: '' };
      });
    } else if (type === 'bool') {
      out[key] = raw.trim().toLowerCase() === 'true';
    } else {
      out[key] = raw;
    }
  });
  return out;
}

function valueToInput(value, type) {
  if (type === 'list') return (value || []).join(', ');
  if (type === 'tiers') return (value || []).map(t => `${t.name}:${t.price}`).join(', ');
  if (type === 'bool') return value ? 'true' : 'false';
  return value || '';
}

function renderPanel(collectionName) {
  const schema = SCHEMAS[collectionName];
  const panel = document.getElementById('panel-' + collectionName);

  panel.innerHTML = `
    <div class="card">
      <h2>Add ${collectionName}</h2>
      <form id="form-new-${collectionName}">
        ${schema.fields.map(([key, label, type]) => fieldToForm(key, label, type, '')).join('')}
        <button type="submit">Add</button>
      </form>
    </div>
    <div id="list-${collectionName}"></div>
  `;

  document.getElementById(`form-new-${collectionName}`).onsubmit = async (e) => {
    e.preventDefault();
    const data = readForm(schema.fields);
    await db.collection(collectionName).add(data);
    e.target.reset();
  };

  db.collection(collectionName).onSnapshot(snapshot => {
    const listEl = document.getElementById(`list-${collectionName}`);
    listEl.innerHTML = '';
    snapshot.forEach(doc => {
      const data = doc.data();
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="row">
          <div><strong>${esc(data.title || data.name || doc.id)}</strong></div>
          <div>
            <button class="secondary" data-action="edit">Edit</button>
            <button class="danger" data-action="delete">Delete</button>
          </div>
        </div>
        <div class="edit-form hidden">
          ${schema.fields.map(([key, label, type]) => fieldToForm(key, label, type, valueToInput(data[key], type))).join('')}
          <button data-action="save">Save</button>
        </div>
      `;
      card.querySelectorAll('[id^="f_"]').forEach(el => {
        el.id = el.id + '-' + doc.id;
      });
      const editForm = card.querySelector('.edit-form');
      card.querySelector('[data-action="edit"]').onclick = () => editForm.classList.toggle('hidden');
      card.querySelector('[data-action="delete"]').onclick = async () => {
        if (confirm('Delete this entry?')) await db.collection(collectionName).doc(doc.id).delete();
      };
      card.querySelector('[data-action="save"]').onclick = async () => {
        const updated = {};
        schema.fields.forEach(([key, label, type]) => {
          const el = document.getElementById('f_' + key + '-' + doc.id);
          const raw = el.value;
          if (type === 'list') updated[key] = raw.split(',').map(s => s.trim()).filter(Boolean);
          else if (type === 'tiers') updated[key] = raw.split(',').map(s => s.trim()).filter(Boolean).map(pair => {
            const [name, price] = pair.split(':').map(s => s.trim());
            return { name: name || '', price: parseFloat(price) || 0, description: '' };
          });
          else if (type === 'bool') updated[key] = raw.trim().toLowerCase() === 'true';
          else updated[key] = raw;
        });
        await db.collection(collectionName).doc(doc.id).update(updated);
        editForm.classList.add('hidden');
      };
      listEl.appendChild(card);
    });
  });
}

let panelsInitialized = false;
function initPanels() {
  if (panelsInitialized) return;
  panelsInitialized = true;
  renderPanel('events');
  renderPanel('places');
  renderPanel('news');
}
</script>
</body>
</html>
